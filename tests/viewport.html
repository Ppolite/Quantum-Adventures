<!doctype html><html lang="en"><meta charset="utf-8"><title>BeatAI preview viewport checks</title><style>body{background:#343a30;color:#fff;font:14px Arial;margin:20px}label{margin-right:15px}select{padding:8px}iframe{display:block;border:1px solid #7a836f;margin-top:15px;width:375px;height:667px;background:#111310}p{max-width:700px;line-height:1.5}</style><h1>Preview viewport checks</h1><p>This harness is excluded from production builds. It changes the iframe viewport, not the device user agent. Use it to check actual layout and gameplay at phone, tablet and desktop sizes.</p><label>Viewport <select id="size"><option value="375,667">Small phone · 375 × 667</option><option value="390,844">Phone · 390 × 844</option><option value="430,932">Large phone · 430 × 932</option><option value="768,1024">Tablet · 768 × 1024</option><option value="1100,780">Desktop · 1100 × 780</option></select></label><label>Site <select id="site"><option value="/">This preview</option><option value="https://beatai.games">Production baseline</option></select></label><iframe id="gameFrame" title="BeatAI test viewport" src="/"></iframe><script>document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');const frame=document.getElementById('gameFrame');frame.style.width=w+'px';frame.style.height=h+'px';};document.getElementById('site').onchange=e=>{document.getElementById('gameFrame').src=e.target.value;};</script></html>
