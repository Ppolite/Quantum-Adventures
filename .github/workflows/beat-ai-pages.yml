name: Deploy Beat AI

on:
  push:
    branches: [beat-ai-mvp]
    paths:
      - 'beat-ai/**'
      - '.github/workflows/beat-ai-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beat-ai-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Beat AI
        uses: actions/upload-pages-artifact@v3
        with:
          path: beat-ai
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
