name: Beat AI Smoke Tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'api/**'
      - 'test.js'
      - '.github/workflows/beat-ai-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
      - 'test.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
