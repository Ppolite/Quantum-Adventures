name: Beat AI Smoke Tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'api/**'
      - 'test.js'
      - '*.js'
      - '*.css'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/beat-ai-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
      - 'test.js'
      - '*.js'
      - '*.css'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
      - run: node scripts/smoke-test.js
      - run: node --test tests/*.test.js
      - run: node scripts/build-vercel.js
